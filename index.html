<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Hungry Frog</title>
		<link rel="stylesheet" href="styles.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="icon" type="image/svg+xml" href="images/frog.svg" />
		<link rel="icon" type="image/png" href="images/frog.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
		<link rel="manifest" href="site.webmanifest" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap"
		/>
	</head>
	<body>
		<!-- Hungry Frog Header -->
		<header class="site-header">
			<div class="header-container">
				<h1 class="logo">🐸 Hungry Frog</h1>
			</div>
		</header>
		<!-- Game container: stats bar and pond -->
		<main id="game-container">
			<div id="stats">
				<p>Flies <span id="score">0</span></p>
				<p>Time <span id="timer">30</span></p>
				<p>Best <span id="best">0</span></p>
			</div>

			<div id="pond">
				<!--Welcome screen that disappears on tap -->
				<section id="welcome-screen">
					<div class="panel">
						<h2>Hungry frog</h2>
						<button id="start-button">Tap to start</button>
					</div>
				</section>

				<!-- End screen: shows when the time runs out -->
				<section id="end-screen" class="hidden">
					<div class="panel">
						<h2>Time's up!</h2>
						<p>You caught <span id="final-score">0</span> flies.</p>
						<button id="play-again">Play again</button>
					</div>
				</section>

				<img id="frog" src="images/frog.svg" alt="frog in the pond" />
				<div id="tongue"></div>
			</div>
		</main>
		<script src="script.js"></script>

		<!-- Hungry Frog Project Footer -->
		<footer class="site-footer">
			<div class="footer-container">
				<div class="footer-brand">
					<h3>Hungry Frog 🐸</h3>
					<p>A fun group web project.</p>
				</div>

				<div class="footer-links">
					<h4>Team members</h4>
					<ul>
						<li>Margarita Nikulina</li>
						<li>Faryal Zahid</li>
						<li>Konstantina Migadaki</li>
						<li>Ayodeji Dairo</li>
					</ul>
				</div>

				<div class="footer-credits">
					<p>2026 Hungry Frog Team. Built with HTML CSS & JAVASCRIPT.</p>
				</div>
			</div>
		</footer>
	</body>
</html>
